services:
  - type: web
    name: okfbench-chat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: okfbench-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: APP_NAME
        value: OKFBench Chat
      - key: PYTHON_VERSION
        value: "3.12.7"

databases:
  - name: okfbench-db
    plan: free
